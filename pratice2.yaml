- name: install pack if it is dnf
  hosts: web
  become: yes
  tasks:
  - name: install pack if dnf
    ansible.builtin.dnf:
      name: "installing {{ item }}"
      state: present
    loop:
    - nginx
  - name: installing nginx
    ansible.builtin.debug:
      msg: "{{ item }}"
    loop:
    - nginx
    when: ansible_os_family == "RedHat"

  - name: install pack if apt
    ansible.builtin.apt:
      name: "{{ item }}"
      state: present
    loop:
    - nginx
    when: ansible_os_family == "Debian"