- name: install nginx and run
  hosts: web
  become: yes
  tasks:
  - name: installing nginx
    ansible.builtin.package:
      name: nginx
      sate: present
  - name: run nginx
    ansible.builtin.service:
      name: nginx
      sate: started
      enable: yes











