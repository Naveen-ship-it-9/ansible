- name: Nginx install and run
  hosts: wed
  become: Yes
  tasks:
  - name: Install Nginx
    ansible.builtin.package:
      name: Nginx
      sate: Present
  - name: run Nginx
    ansible.builtin.service:
      name: Nginx
      sate: started
      enable: Yes











